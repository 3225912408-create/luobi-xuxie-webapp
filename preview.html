:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);

}

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;

.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;luobi-prototype&#x27;);
    const state = {

      &lt;div class=&quot;lx-photo lx-photo-night ${extra}&quot; role=&quot;img&quot; aria-label=&quot;有星星的紫色夜空&quot;&gt;

    const coffeePhoto = (extra = &#x27;&#x27;) =&gt; `

    const appHeader = () =&gt; `
      ${statusBar()}
      &lt;header class=&quot;lx-app-head&quot;&gt;

        &lt;div class=&quot;lx-avatar&quot; aria-label=&quot;张续的头像&quot;&gt;续&lt;/div&gt;

    const nav = () =&gt; {
      const item = (view, icon, label) =&gt; `
        &lt;button type=&quot;button&quot; data-nav=&quot;${view}&quot; ${state.view === view ? &#x27;aria-current=&quot;page&quot;&#x27; : &#x27;&#x27;}&gt;
          &lt;i data-lucide=&quot;${icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${label}&lt;/span&gt;
        &lt;/button&gt;`;
      return `
        &lt;nav class=&quot;lx-nav&quot; aria-label=&quot;主要页面&quot;&gt;
          ${item(&#x27;home&#x27;, &#x27;house&#x27;, &#x27;首页&#x27;)}

            &lt;i data-lucide=&quot;camera&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
          &lt;/button&gt;
          ${item(&#x27;mail&#x27;, &#x27;mail&#x27;, &#x27;信箱&#x27;)}
          ${item(&#x27;us&#x27;, &#x27;heart&#x27;, &#x27;我们&#x27;)}

    };

    const homeView = () =&gt; `
      &lt;main class=&quot;lx-main&quot;&gt;
        &lt;section class=&quot;lx-hero&quot; aria-label=&quot;恋爱纪念日&quot;&gt;

          &lt;div class=&quot;lx-hero-foot&quot;&gt;
            &lt;span&gt;始于 &lt;strong&gt;2025.06.29&lt;/strong&gt;&lt;/span&gt;
            &lt;span&gt;下次纪念日 &lt;strong&gt;330 天&lt;/strong&gt;&lt;/span&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;div class=&quot;lx-section-head&quot;&gt;
          &lt;h2&gt;最近一笔&lt;/h2&gt;&lt;span&gt;今天 18:42&lt;/span&gt;
        &lt;/div&gt;
        &lt;article class=&quot;lx-moment&quot;&gt;
          ${sunsetPhoto()}
          &lt;div class=&quot;lx-moment-copy&quot;&gt;
            &lt;p&gt;“回家的晚霞很好看，想让你也看见。”&lt;/p&gt;
            &lt;div class=&quot;lx-meta&quot;&gt;
              &lt;span&gt;张续 · 杭州&lt;/span&gt;
              &lt;span&gt;&lt;i data-lucide=&quot;heart&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 落学富已续写&lt;/span&gt;

        &lt;/article&gt;

          &lt;button type=&quot;button&quot; class=&quot;lx-quick&quot; data-action=&quot;mood&quot;&gt;&lt;i data-lucide=&quot;cloud-sun&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${state.mood}&lt;/span&gt;&lt;/button&gt;

    const storyView = () =&gt; `

            &lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;lx-chapter&quot;&gt;
            &lt;span class=&quot;lx-chapter-dot&quot;&gt;&lt;/span&gt;
            &lt;div class=&quot;lx-chapter-date&quot;&gt;2026.06.29 · 一周年&lt;/div&gt;
            &lt;h3&gt;我们的第一年&lt;/h3&gt;
            &lt;div class=&quot;lx-chapter-row&quot;&gt;
              ${nightPhoto(&#x27;lx-thumb&#x27;)}
              &lt;div class=&quot;lx-chapter-copy&quot;&gt;&lt;p&gt;从第一天，到第 365 天。&lt;/p&gt;&lt;span&gt;12 张照片 · 1 封语音信&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/article&gt;
          &lt;article class=&quot;lx-chapter&quot;&gt;
            &lt;span class=&quot;lx-chapter-dot&quot;&gt;&lt;/span&gt;
            &lt;div class=&quot;lx-chapter-date&quot;&gt;2025.06.29 · 第 1 天&lt;/div&gt;

            &lt;div class=&quot;lx-chapter-row&quot;&gt;

            &lt;/div&gt;
          &lt;/article&gt;
        &lt;/section&gt;
      &lt;/main&gt;`;

    const writeView = () =&gt; `
      &lt;main class=&quot;lx-main&quot;&gt;
        &lt;div class=&quot;lx-page-title&quot;&gt;&lt;h1&gt;落下一笔&lt;/h1&gt;&lt;p&gt;把你此刻看到的世界寄给他&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;lx-compose-photo lx-photo lx-photo-sunset&quot; role=&quot;img&quot; aria-label=&quot;准备发送的晚霞照片&quot;&gt;

    const mailView = () =&gt; `

        &lt;div class=&quot;lx-page-title&quot;&gt;&lt;h1&gt;时光邮局&lt;/h1&gt;&lt;p&gt;有些话，要留给未来的某一天&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;lx-mail-list&quot;&gt;

            &lt;div class=&quot;lx-mail-icon&quot;&gt;&lt;i data-lucide=&quot;cake-slice&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;
            &lt;div class=&quot;lx-mail-copy&quot;&gt;&lt;strong&gt;落先生，生日快乐&lt;/strong&gt;&lt;span&gt;一封照片信 · 由张续寄出&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;lx-us-list&quot;&gt;
            ${wish(0, &#x27;一起看一次海边日出&#x27;, &#x27;已完成 · 2026.05.02&#x27;)}
            ${wish(1, &#x27;去一座陌生城市散步&#x27;, &#x27;等一个都有空的周末&#x27;)}
            ${wish(2, &#x27;拍一组属于我们的照片&#x27;, &#x27;计划中&#x27;)}
          &lt;/div&gt;

          &lt;div class=&quot;lx-section-head&quot;&gt;&lt;h3&gt;我们的收藏&lt;/h3&gt;&lt;span&gt;仅彼此可见&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;lx-us-list&quot;&gt;
            &lt;article class=&quot;lx-us-item&quot;&gt;&lt;div class=&quot;lx-us-icon&quot;&gt;&lt;i data-lucide=&quot;map&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;lx-us-copy&quot;&gt;&lt;strong&gt;共同地图&lt;/strong&gt;&lt;span&gt;7 个地方 · 23 段回忆&lt;/span&gt;&lt;/div&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/article&gt;
            &lt;article class=&quot;lx-us-item&quot;&gt;&lt;div class=&quot;lx-us-icon&quot;&gt;&lt;i data-lucide=&quot;images&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;lx-us-copy&quot;&gt;&lt;strong&gt;私密相册&lt;/strong&gt;&lt;span&gt;48 张照片 · 已加密保存&lt;/span&gt;&lt;/div&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/article&gt;
            &lt;article class=&quot;lx-us-item&quot;&gt;&lt;div class=&quot;lx-us-icon&quot;&gt;&lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;lx-us-copy&quot;&gt;&lt;strong&gt;每日一问&lt;/strong&gt;&lt;span&gt;今天：最想和我重过哪一天？&lt;/span&gt;&lt;/div&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/main&gt;`;
    };

    const overlay = () =&gt; {
      if (state.overlay === &#x27;mood&#x27;) {
        return `&lt;div class=&quot;lx-overlay&quot;&gt;&lt;section class=&quot;lx-sheet&quot; aria-label=&quot;选择今日心情&quot;&gt;&lt;h3&gt;今天是什么天气？&lt;/h3&gt;&lt;p&gt;让他不用追问，也能知道你此刻的心情。&lt;/p&gt;&lt;div class=&quot;lx-moods&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;lx-mood&quot; data-mood=&quot;晴天&quot; aria-label=&quot;晴天&quot;&gt;☀️&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lx-mood&quot; data-mood=&quot;多云&quot; aria-label=&quot;多云&quot;&gt;⛅&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lx-mood&quot; data-mood=&quot;雨天&quot; aria-label=&quot;雨天&quot;&gt;🌧️&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lx-mood&quot; data-mood=&quot;打雷&quot; aria-label=&quot;打雷&quot;&gt;⛈️&lt;/button&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;lx-secondary&quot; data-action=&quot;close-overlay&quot;&gt;暂不修改&lt;/button&gt;&lt;/section&gt;&lt;/div&gt;`;
      }
      if (state.overlay === &#x27;secret&#x27;) {
        return `&lt;div class=&quot;lx-overlay&quot;&gt;&lt;section class=&quot;lx-sheet&quot; aria-label=&quot;输入两人的暗号&quot;&gt;&lt;h3&gt;我们的暗号&lt;/h3&gt;&lt;p&gt;提示：故事开始的月与日。&lt;/p&gt;${state.secretSolved ? &#x27;&lt;div class=&quot;lx-secret-reveal&quot;&gt;落先生：&lt;br&gt;谢谢你来到我的故事里。&lt;br&gt;往后的每一页，也想继续和你写。&lt;/div&gt;&#x27; : &#x27;&lt;label for=&quot;lx-secret-code&quot; class=&quot;sr-only&quot;&gt;四位暗号&lt;/label&gt;&lt;input id=&quot;lx-secret-code&quot; class=&quot;lx-secret-input&quot; inputmode=&quot;numeric&quot; maxlength=&quot;4&quot; placeholder=&quot;输入四位暗号&quot;&gt;&lt;div class=&quot;lx-sheet-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;lx-secondary&quot; data-action=&quot;close-overlay&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;lx-primary&quot; data-action=&quot;check-secret&quot;&gt;解锁&lt;/button&gt;&lt;/div&gt;&#x27;}&lt;/section&gt;&lt;/div&gt;`;
      }
      return &#x27;&#x27;;
    };

    const iphoneScreen = () =&gt; {
      const views = { home: homeView, story: storyView, write: writeView, mail: mailView, us: usView };
      return `&lt;div class=&quot;lx-device-label&quot;&gt;&lt;strong&gt;张续的 iPhone&lt;/strong&gt;&lt;span&gt;发送端预览&lt;/span&gt;&lt;/div&gt;&lt;section class=&quot;lx-phone&quot;&gt;${appHeader()}${views[state.view]()}${nav()}${state.toast ? `&lt;div class=&quot;lx-toast&quot; role=&quot;status&quot;&gt;${state.toast}&lt;/div&gt;` : &#x27;&#x27;}${overlay()}&lt;/section&gt;`;
    };

    const androidLock = () =&gt; `
      &lt;div class=&quot;lx-device-label&quot;&gt;&lt;strong&gt;落学富的 Android&lt;/strong&gt;&lt;span&gt;接收效果预览&lt;/span&gt;&lt;/div&gt;
      &lt;section class=&quot;lx-phone lx-android&quot;&gt;
        ${statusBar(true)}
        &lt;div class=&quot;lx-lock-time&quot;&gt;&lt;strong&gt;18:42&lt;/strong&gt;&lt;span&gt;8 月 3 日 · 星期一&lt;/span&gt;&lt;/div&gt;
        &lt;article class=&quot;lx-android-notification&quot;&gt;
          &lt;div class=&quot;lx-notification-head&quot;&gt;&lt;span class=&quot;lx-notification-logo&quot;&gt;续&lt;/span&gt;&lt;span&gt;落笔续写 · 刚刚&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;lx-notification-body&quot;&gt;&lt;div&gt;&lt;strong&gt;张续刚刚落下一笔&lt;/strong&gt;&lt;p&gt;${state.caption}&lt;/p&gt;&lt;/div&gt;${sunsetPhoto(&#x27;lx-notification-photo&#x27;)}&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;lx-notification-tap&quot; data-action=&quot;open-notification&quot;&gt;点击查看并续写这一笔&lt;/button&gt;
        &lt;/article&gt;
        &lt;p class=&quot;lx-lock-note&quot;&gt;照片会在允许通知后显示在他的锁屏上&lt;/p&gt;
        &lt;button type=&quot;button&quot; class=&quot;lx-back-sender&quot; data-action=&quot;back-sender&quot;&gt;返回张续的手机&lt;/button&gt;
      &lt;/section&gt;`;

    const receivedScreen = () =&gt; `
      &lt;div class=&quot;lx-device-label&quot;&gt;&lt;strong&gt;落学富的 Android&lt;/strong&gt;&lt;span&gt;打开照片后的效果&lt;/span&gt;&lt;/div&gt;
      &lt;section class=&quot;lx-phone&quot;&gt;
        ${statusBar()}
        &lt;header class=&quot;lx-app-head&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;lx-secondary&quot; data-action=&quot;android-lock&quot;&gt;&lt;i data-lucide=&quot;arrow-left&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 返回&lt;/button&gt;&lt;div class=&quot;lx-brand&quot;&gt;她的一笔&lt;/div&gt;&lt;div class=&quot;lx-avatar&quot;&gt;续&lt;/div&gt;&lt;/header&gt;
        &lt;main class=&quot;lx-main&quot;&gt;
          ${sunsetPhoto(&#x27;lx-received-photo&#x27;)}
          &lt;p class=&quot;lx-received-words&quot;&gt;“${state.caption}”&lt;span class=&quot;lx-received-time&quot;&gt;张续 · 今天 18:42 · 杭州&lt;/span&gt;&lt;/p&gt;
          &lt;div class=&quot;lx-reactions&quot; aria-label=&quot;回应照片&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;lx-reaction&quot; data-action=&quot;reply&quot;&gt;❤️ 喜欢&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;lx-reaction&quot; data-action=&quot;reply&quot;&gt;🫂 抱抱&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;lx-reaction&quot; data-action=&quot;reply&quot;&gt;✍️ 续写&lt;/button&gt;
          &lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;lx-primary&quot; data-action=&quot;reply&quot;&gt;${state.replySent ? &#x27;已告诉张续：我收到啦&#x27; : &#x27;告诉她：我收到啦&#x27;}&lt;/button&gt;
        &lt;/main&gt;
        ${state.toast ? `&lt;div class=&quot;lx-toast&quot; role=&quot;status&quot;&gt;${state.toast}&lt;/div&gt;` : &#x27;&#x27;}
      &lt;/section&gt;`;

    const introScreen = () =&gt; `
      &lt;div class=&quot;lx-device-label&quot;&gt;&lt;strong&gt;首次打开&lt;/strong&gt;&lt;span&gt;礼物开场页&lt;/span&gt;&lt;/div&gt;
      &lt;section class=&quot;lx-phone lx-intro&quot;&gt;
        ${statusBar()}
        &lt;div class=&quot;lx-intro-copy&quot;&gt;
          &lt;div class=&quot;lx-intro-mark&quot;&gt;落 · 续&lt;/div&gt;
          &lt;h1&gt;落笔续写&lt;/h1&gt;
          &lt;div class=&quot;lx-intro-names&quot;&gt;张续 × 落学富&lt;/div&gt;
          &lt;p class=&quot;lx-intro-quote&quot;&gt;落笔记录此刻&lt;br&gt;续写我们的以后&lt;/p&gt;
          &lt;div class=&quot;lx-intro-date&quot;&gt;始于 2025.06.29&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;lx-intro-action&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;lx-primary&quot; data-action=&quot;start&quot;&gt;开始续写&lt;/button&gt;&lt;/div&gt;
      &lt;/section&gt;`;

    const render = () =&gt; {
      let content = &#x27;&#x27;;
      if (state.intro) content = introScreen();
      else if (state.device === &#x27;android&#x27; &amp;&amp; state.view === &#x27;android-lock&#x27;) content = androidLock();
      else if (state.device === &#x27;android&#x27; &amp;&amp; state.view === &#x27;received&#x27;) content = receivedScreen();
      else content = iphoneScreen();
      root.innerHTML = `&lt;div class=&quot;lx-stage&quot;&gt;${content}&lt;/div&gt;`;
      if (typeof lucide !== &#x27;undefined&#x27;) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    };

    const flash = (message) =&gt; {
      state.toast = message;
      render();
      window.setTimeout(() =&gt; {
        if (state.toast === message) {
          state.toast = &#x27;&#x27;;
          render();
        }
      }, 1700);
    };

    root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      const navButton = event.target.closest(&#x27;[data-nav]&#x27;);
      if (navButton) {
        state.view = navButton.dataset.nav;
        state.toast = &#x27;&#x27;;
        render();
        return;
      }

      const moodButton = event.target.closest(&#x27;[data-mood]&#x27;);
      if (moodButton) {
        state.mood = moodButton.dataset.mood;
        state.overlay = null;
        flash(`今日心情已改为“${state.mood}”`);
        return;
      }

      const wishButton = event.target.closest(&#x27;[data-wish]&#x27;);
      if (wishButton) {
        const index = Number(wishButton.dataset.wish);
        state.wishes[index] = !state.wishes[index];
        flash(state.wishes[index] ? &#x27;愿望已盖上“已实现”印章&#x27; : &#x27;愿望已放回计划中&#x27;);
        return;
      }

      const actionButton = event.target.closest(&#x27;[data-action]&#x27;);
      if (!actionButton) return;
      const action = actionButton.dataset.action;

      if (action === &#x27;start&#x27;) {
        state.intro = false;
        state.view = &#x27;home&#x27;;
        render();
      } else if (action === &#x27;miss&#x27;) {
        flash(&#x27;“张续现在有一点想你”已送达&#x27;);
      } else if (action === &#x27;mood&#x27;) {
        state.overlay = &#x27;mood&#x27;;
        render();
      } else if (action === &#x27;secret&#x27;) {
        state.overlay = &#x27;secret&#x27;;
        render();
      } else if (action === &#x27;close-overlay&#x27;) {
        state.overlay = null;
        render();
      } else if (action === &#x27;check-secret&#x27;) {
        const input = root.querySelector(&#x27;#lx-secret-code&#x27;);
        if (input &amp;&amp; input.value === &#x27;0629&#x27;) {
          state.secretSolved = true;
          render();
        } else {
          flash(&#x27;暗号不对，再想想故事开始的日期&#x27;);
        }
      } else if (action === &#x27;send&#x27;) {
        const caption = root.querySelector(&#x27;#lx-caption&#x27;);
        if (caption &amp;&amp; caption.value.trim()) state.caption = caption.value.trim();
        state.device = &#x27;android&#x27;;
        state.view = &#x27;android-lock&#x27;;
        state.toast = &#x27;&#x27;;
        render();
      } else if (action === &#x27;open-notification&#x27;) {
        state.view = &#x27;received&#x27;;
        render();
      } else if (action === &#x27;android-lock&#x27;) {
        state.view = &#x27;android-lock&#x27;;
        render();
      } else if (action === &#x27;back-sender&#x27;) {
        state.device = &#x27;iphone&#x27;;
        state.view = &#x27;home&#x27;;
        render();
      } else if (action === &#x27;reply&#x27;) {
        state.replySent = true;
        flash(&#x27;你的回应已经送给张续&#x27;);
      } else if (action === &#x27;locked&#x27;) {
        flash(&#x27;时间还没到，这封信会替你们好好保管&#x27;);
      } else if (action === &#x27;voice&#x27;) {
        state.voicePlaying = !state.voicePlaying;
        render();
      }
    });

    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
